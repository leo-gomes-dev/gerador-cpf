<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validador de CPF | Leo Gomes Developer</title>
    <style>
      :root {
        --primary-color: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-color: #cbd5e1;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background-color: var(--card-bg);
        padding: 40px;
        border-radius: 12px;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
        width: 100%;
        max-width: 450px;
        text-align: center;
      }

      h1 {
        font-size: 1.8rem;
        margin-bottom: 8px;
        color: var(--text-main);
      }

      .subtitle {
        font-size: 0.95rem;
        color: var(--text-muted);
        margin-bottom: 24px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 24px;
      }

      .cpf-input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid var(--border-color);
        border-radius: 6px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
        text-align: center;
        letter-spacing: 1px;
      }

      .cpf-input:focus {
        border-color: var(--primary-color);
      }

      .btn-cpf {
        width: 100%;
        background-color: var(--primary-color);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .btn-cpf:hover {
        background-color: var(--primary-hover);
      }

      .box-cpf {
        min-height: 24px;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--primary-color);
        margin-top: 8px;
        word-break: break-all;
      }

      footer {
        margin-top: 40px;
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      footer a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 600;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Validador de CPF</h1>
      <p class="subtitle">
        Insira seu CPF abaixo para realizar a validação matemática:
      </p>

      <div class="form-group">
        <input
          type="text"
          class="cpf-input"
          placeholder="000.000.000-00"
          maxlength="14"
        />
        <button class="btn-cpf">Validar CPF</button>
      </div>

      <div class="box-cpf"></div>
    </div>

    <footer>
      Desenvolvido em aula por
      <a href="https://leogomesdeveloper.com" target="_blank"
        >Leo Gomes Developer</a
      >
    </footer>

    <script src="./cpf.js"></script>
  </body>
</html>
